description: "Root Cause Analysis (RCA), reproduction steps, and regression-proof one-line scenarios."
instruction: |
  Generate a lean bugfix specification focusing on the "Why" and "Where" of the failure. Adhere strictly to the following execution rules:

  1. **Diagnostic Rigor:** You MUST document the exact observations (logs, errors) that led to the discovery.
  2. **Reproduction Mandate:** You MUST provide concrete, runnable, ordered step-by-step instructions to reproduce the bug.
  3. **Review Brief First:** The document MUST open with `## 0. Review Brief` of about 8 lines, with three items: **Fix**, **Decisions** and **Review closely**, each with at most 3 short bullets. When no decision beyond the request exists, the Decisions item says so in one line. Review closely MUST name criterion or scenario ids (e.g., FIX-1.b).
  4. **Lettered Regression Scenarios:** Each `[FIX-n]` criterion has lettered one-line scenarios in the form `- **a.** situation → result`, focused on the FIX and on preventing regressions. Merge scenarios that share the same result. Scenarios are cited elsewhere as criterion id + letter (e.g., FIX-1.a).
  5. **Root Cause Rule:** The Root Cause Analysis MUST be based on evidence. If the root cause is not established, halt and ask the user or recommend `/spf:discovery` instead of guessing.
  6. **RED Regression Link:** Every `[FIX-x]` acceptance criterion MUST map to the first RED regression test task of the roadmap.
  7. **Constraints Only When Real:** Include `## 6. Constraints` only for a real, measurable limit of this fix; never invent numbers. Omit the section otherwise.
  8. **YAML Frontmatter:** Ensure the top YAML block is correctly populated with the `slug` and `lens: Bugfix`.
template: |
  ---
  slug: {FEATURE_SLUG}
  lens: Bugfix
  ---

  # Bugfix: {FEATURE_NAME}

  ## 0. Review Brief
  - **Fix:** [What is fixed and its effect for the user, at most 3 short bullets.]
  - **Decisions:** [Decisions made beyond the request, at most 3 short bullets. If none, one line saying so.]
  - **Review closely:** [Criterion or scenario ids that deserve attention, e.g., FIX-1.b.]

  ## 1. Issue Description
  [Briefly describe the bug and its impact on the system or user.]

  ## 2. Evidence & Observations
  *Paste relevant logs, error messages, or screenshots descriptions.*
  - **Symptom:** [e.g., Command fails with 'null pointer' when flag X is missing]
  - **Trace:** [e.g., Error occurs at internal/parser/engine.go:124]

  ## 3. Reproduction Steps
  1. [Step 1: Environment setup]
  2. [Step 2: Action to trigger]
  3. [Step 3: Expected vs Actual outcome]

  ## 4. Root Cause Analysis (RCA)
  *Explain why the bug exists based on your discovery.*
  - [e.g., The state machine doesn't account for the 'Cancelled' state during transition Y].

  ## 5. Acceptance Criteria (Regression Tests)

  ### [FIX-1] {Title}
  - **a.** [situation that previously failed] → [corrected result].
  - **b.** [neighbouring situation that must keep working] → [expected result].

  ### [FIX-2] {Title}
  *(Repeat structure as needed)*

  ## 6. Constraints
  *Only for a real, measurable limit of this fix. Omit this section otherwise.*
  - [e.g., Fix must not add a new dependency].
