description: "Functional requirements, business rules, and compact one-line acceptance scenarios."
instruction: |
  Generate a lean, reviewable business specification focusing entirely on the "What" and "Why", never the "How". Adhere strictly to the following execution rules for SELF-CONTAINMENT:

  1. **Zero Context Leak Mandate:** The specification MUST be actionable by an AI agent with zero access to the previous conversation history. Every business rule and constraint MUST be explicitly stated.
  2. **Strict Zero-Technical-Specification Policy:** Requirements MUST contain exclusively business rules, user stories, and acceptance scenarios (focusing purely on 'What' and 'Why'). DO NOT include technical implementation details, code, specific endpoints/URLs, HTTP status codes, library names, JSON payloads, database schemas/SQL, or technical parsing mechanisms in requirements.md. User Stories MUST use end-user/business personas (never developer/technical personas). All technical implementation details belong strictly in design.md.
  3. **Review Brief First:** The document MUST open with `## 0. Review Brief` of about 8 lines, with three items: **Changes**, **Decisions** and **Review closely**, each with at most 3 short bullets. When no decision beyond the request exists, the Decisions item says so in one line. Review closely MUST name requirement or scenario ids (e.g., US-3, US-1.e) so a reviewer knows where to look first.
  4. **One-Line Stories and Scenarios:** Each requirement is `### [US-n] Title`, a ONE-LINE user story (`AS A ..., I WANT ..., SO THAT ...`), then lettered one-line scenarios in the form `- **a.** situation → result`. Merge scenarios that share the same result. Write a failure scenario only when a real failure case exists; never pad a requirement with an invented one. Scenarios are cited elsewhere as requirement id + letter (e.g., US-3.b).
  5. **Constraint Line:** A requirement carries no per-requirement UI or non-functional blocks. It MAY carry one optional `**Constraint:**` line, written as its own paragraph after a blank line, only for a deviation from the General Rules.
  6. **Context Limit:** `## 1. Context` has at most 2 sentences: the problem and its value.
  7. **Scope Containment:** Pay heavy attention to the `## 2. Out of Scope` section. Explicitly list features or edge cases that downstream agents MUST NOT build.
  8. **General Rules Once:** Feature-wide rules live in `## 4. General Rules`, stated once, with up to three bullets: **Domain** (business rules the feature must never violate), **Interface** and **Quality**. If the `lens` is "Backend-heavy" or "Integration", completely omit the **Interface** bullet. A **Quality** line is written only for a real, measurable target of this feature; never invent numbers, and vague terms like "optimized" or "secure" are forbidden. No line may state that something "does not change" or "does not apply"; omit it instead.
  9. **YAML Frontmatter:** Ensure the top YAML block is correctly populated with the `slug` and the correct `lens`.
template: |
  ---
  slug: {FEATURE_SLUG}
  lens: [UI-heavy | Backend-heavy | Integration | Migration | Balanced full-stack]
  ---

  # Feature: {FEATURE_NAME}

  ## 0. Review Brief
  - **Changes:** [What changes for the user, in at most 3 short bullets.]
  - **Decisions:** [Decisions made beyond the request, at most 3 short bullets. If none, one line saying so.]
  - **Review closely:** [Requirement or scenario ids that deserve attention, e.g., US-3, US-1.e.]

  ## 1. Context
  [The problem and its value. Max 2 sentences.]

  ## 2. Out of Scope (Anti-Goals)
  - [What MUST NOT be built in this feature, e.g., the email notification flow.]

  ## 3. Requirements

  ### [US-1] {Title}
  AS A [persona], I WANT [action], SO THAT [value].
  - **a.** [situation] → [result].
  - **b.** [failure situation, only if a real failure case exists] → [result].

  **Constraint:** [Optional. Only a deviation from the General Rules.]

  ### [US-2] {Title}
  *(Repeat structure as needed)*

  ## 4. General Rules
  - **Domain:** [Business rules the feature must never violate.]
  - **Interface:** [Feature-wide interface rules. Omit this bullet for features without a user interface.]
  - **Quality:** [Only a real, measurable target of this feature. Omit if none.]
