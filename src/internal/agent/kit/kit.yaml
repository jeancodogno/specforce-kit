defaults:
  skills:
    path: "skills"
    ext: ".md"

tools:
  claude:
    name: "Claude"
    description: "Anthropic's Claude agent integration."
    target: ".claude/"
    mappings:
      skills:
        - path: "skills"
          ext: ".md"

  qwen:
    name: "Qwen"
    description: "Alibaba's Qwen agent integration."
    target: ".qwen/"
    mappings:
      skills:
        - path: "skills"
          ext: ".md"

  open-code:
    name: "OpenCode"
    description: "OpenCode agent integration."
    target: ".opencode/"
    mappings:
      skills:
        - path: "skills"
          ext: ".md"

  kilo-code:
    name: "KiloCode"
    description: "KiloCode agent integration."
    target: ".kilocode/"
    mappings:
      skills:
        - path: "skills"
          ext: ".md"

  codex:
    name: "Codex"
    description: "Codex agent integration."
    target: ".codex/"
    security:
      global_write: true
    mappings:
      skills:
        - path: "skills"
          ext: ".md"
      commands:
        - target: "${CODEX_PROMPTS_DIR:-${CODEX_HOME:-~/.codex}/prompts}"
          path: "."
          name: "spf-*"
          ext: ".md"

  antigravity:
    name: "Antigravity"
    description: "Antigravity workflow integration."
    target: ".agents/"
    mappings:
      skills:
        - path: "skills"
          ext: ".md"

  kimi-code:
    name: "Kimi Code"
    description: "Moonshot AI's Kimi Code CLI agent."
    target: ".kimi/"
    mappings:
      skills:
        - path: "skills"
          ext: ".md"

  cursor:
    name: "Cursor"
    description: "Cursor AI Editor integration."
    target: ".cursor/"
    mappings:
      skills:
        - path: "skills"
          ext: ".md"
