    findings:
        - title: CI shows no per-test output on macOS/Windows
          detail: ci.yml runs go test ./... without -v on non-ubuntu runners, so Windows skip reasons are not visible in CI logs.
        - title: main_test.go sets HOME without USERPROFILE
          detail: src/cmd/specforce/main_test.go:72,123; harmless because those tests skip on Windows first.
        - title: Hook helper fails on paths with spaces
          detail: createHookScript fails when the test binary path contains whitespace, because hook commands are split on spaces.
        - title: Node 20 action deprecation
          detail: actions/checkout@v4 and actions/setup-go@v5 target the deprecated Node 20 runtime.
