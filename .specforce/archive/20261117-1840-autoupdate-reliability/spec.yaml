          evidence: 'S3 prints 1,0,0; last_checked_at written offline; DEBUG ''check skipped: throttled'''
          verdict: PASSED
        - id: FIX-7/exact-version-channel
          scenario: npm install uses the exact version from the matching channel tag
          evidence: beta.2 -> @1.0.0-beta.3; alpha.1 -> @1.0.0-alpha.3; 0.2.1 -> @0.2.2
