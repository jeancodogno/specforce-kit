          evidence: install -g @jeancodogno/specforce-kit@1.0.0-beta.3 = dist-tags.beta
          verdict: PASSED
    findings:
        - title: 'High: corrupt staged binary is applied and leaves the install unusable'
          detail: 'Staged file is not re-verified before the swap. A 0-byte or random staged specforce_next with valid newer staged_version and target_path is swapped in (orchestrator reproduced: executable became 0 bytes). applied_version recorded although re-exec failed; only specforce.old remains. Fix proposal: store sha256 and size at staging, re-verify before swap, roll back to .old when re-exec fails. Needs a spec update (behavior change).'
        - title: 'Medium: unparseable state.json silently disables auto-update permanently'
          detail: Load error makes CheckForUpdate and PerformBackgroundUpdate return early; the file is never reset.
        - title: 'Low: npm install that succeeds without changing the running binary repeats every 6h'
          detail: If npm installs into a different global prefix, applied_version never matches; 'UPDATE AVAILABLE ... applied automatically' shows on every interactive run and the install repeats.
        - title: 'Low: specforce.old can linger after a swap'
          detail: When the swap happens on --version (no PersistentPreRun), .old stays until the next normal command.
        - title: 'Info: 13 empty /tmp/specforce-update-* files'
          detail: 0-byte leftovers dated 2026-11-17 11:00:14 to 21:11:33; the later ones were likely created by unit test runs before the T5.2 cleanup fix landed. Not removed.
        - title: 'Info: symlinked install path'
          detail: checkForSwap passes the unresolved os.Executable path; QA observed the real file upgraded with the symlink intact.
