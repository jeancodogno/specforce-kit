    criteria:
        - id: FIX-1/no-download-no-retry
          scenario: 'Non-writable install dir, newer version: nothing downloaded or staged, version recorded as manual'
          evidence: 'S1: chmod 555 install dir, beta.2 --internal-upgrade-check exit 0; staged count 0; state update_ready:false, manual_update_version:v1.0.0-beta.3 (re-verified by orchestrator: 0)'
          verdict: PASSED
        - id: FIX-1/hint-once-per-version
          scenario: Manual hint shown once on stderr, naming version and command, never says applied automatically
          evidence: 'S1 run1 ''MANUAL UPDATE REQUIRED Specforce v1.0.0-beta.3'' + releases URL + ''sudo make install''; run2 0 matches; ''applied automatically'' 0; hint only in stderr file (orchestrator re-run: 4 / 0 / 0)'
          verdict: PASSED
        - id: FIX-2/failed-swap-clears-pending
          scenario: 'Swap failure: version unchanged, ready cleared, staged deleted, manual recorded, no retry'
          evidence: 'beta.3 installed, beta.9 staged, dir 555: ''swap failed ... permission denied; v1.0.0-beta.9 requires a manual update''; --version 1.0.0-beta.3; staged 0; update_ready:false, manual_update_version:v1.0.0-beta.9; second run no swap attempt'
          verdict: PASSED
        - id: FIX-3/older-or-equal-discarded
          scenario: Older or equal staged version not applied and discarded
          evidence: 'beta.3 + staged beta.2: skipped ''not newer; discarding'', version stays beta.3, staged 0; equal: sha256 unchanged, staged deleted'
          verdict: PASSED
        - id: FIX-3/newer-applied
          scenario: Newer staged version in writable dir is applied and the command runs on it
          evidence: 'beta.3 + staged beta.9: --version prints 1.0.0-beta.9 immediately and next run; applied_version:v1.0.0-beta.9'
          verdict: PASSED
        - id: FIX-4/other-executables-ignore
          scenario: Executable B ignores the update staged for A
          evidence: 'B: ''swap skipped: targets .../i/specforce, not .../b/specforce'', stays beta.3; staged file and update_ready intact; A then becomes beta.9'
          verdict: PASSED
        - id: FIX-4/target-missing
          scenario: Update staged for a nonexistent path is left untouched
          evidence: 'target_path=.../deleted/specforce: skipped, binary unchanged, staged file and update_ready intact'
          verdict: PASSED
        - id: FIX-5/agent-json-during-swap
          scenario: Agent JSON command applies the update and stdout parses as JSON
          evidence: 'S2: after real staged beta.3, spec list --json 2>/dev/null passes json.tool (JSON_OK); --version 1.0.0-beta.3'
          verdict: PASSED
        - id: FIX-5/notices-interactive-only
