    findings:
        - title: publish accepts an empty channel
          detail: The script does not validate the channel argument; the workflow guards it because the channel step fails first.
        - title: Malformed root package.json prints a Node stack trace
          detail: check-version requires package.json before its try/catch.
        - title: --release-notes path is not quoted
          detail: A path with spaces would split; harmless on GitHub runners.
        - title: notes <tag> does not sanitise the tag
          detail: '''../'' in the tag resolves outside .github/release-notes; low risk since tags come from ''v*'' refs.'
        - title: npm latest currently points to 0.2.2
          detail: Plain 'npm i -g @jeancodogno/specforce-kit' installs 0.2.2 today; the 1.0.0 release moves latest as intended.
        - title: QA side effect
          detail: QA deleted a pre-existing gitignored dist/ directory (old v0.2.2-next snapshot build output, regenerable).
        - title: Reproducibility depends on the CI Go version
          detail: Byte-identical rebuilds were proven on one host and toolchain; CI pins go-version 1.26.3 in release.yml, which keeps re-runs on the same toolchain.
