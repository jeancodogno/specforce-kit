    findings:
        - title: Constraints block end differs between validator and parser
          detail: tasks.go closes the constraints block only on Target, Context or Acceptance Check, while implementation.go closes it on any bold heading. Bullets under an unknown heading such as Notes after Constraints are counted toward the path warning, giving a false-positive warning; validity is never affected.
        - title: Design inventory and T2.6 name the wrong render file
          detail: design.md section 4 and task T2.6 target src/internal/cli/spec.go, but warning rendering is in src/internal/tui/spec.go; behaviour is correct, spec text is inconsistent. cli/implementation_test.go is listed but was not modified.
        - title: spec status exits 0 when is_valid is false
          detail: Pre-existing on the HEAD baseline; not introduced by this spec.
        - title: Task and phase headers inside fenced blocks are still parsed
          detail: 'Pre-existing: header regexes run before the fence-aware field parsing, so a task-like line inside a fenced block is read as a header.'
        - title: Local lint tooling
          detail: The snap golangci-lint on PATH fails in this sandbox even on a clean tree; the GOPATH binary was used and reports 0 issues.
