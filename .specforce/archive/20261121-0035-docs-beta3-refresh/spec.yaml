    findings:
        - title: S5 / T2.1 / T3.1 / T4.1 bash checks are vacuous
          detail: The awk pattern /^```bash/ only matches unindented fences; workflows.md indents every fence inside list items, so S5, the T2.1 allow-list clause and the T3.1/T4.1 diff all compare empty input and would pass for any content. The indentation-aware variant passes (8 allowed lines per language, pt/es byte-identical to en). Suggest updating the scenario commands to /^[ \t]*```bash/ in a later spec.
        - title: specforce init with tool keys deletes whole tool directories, which the docs understate
          detail: src/internal/cli/cli.go resolveDirectAgents marks every installed tool not in the args as removed, and project.Service.DecommissionAgents runs os.RemoveAll on the tool's directory (e.g. .claude/, .cursor/), not only its skills. workflows.md recipe 11 says init 'removes those [skills] of installed tools you left out', and cli.md says 'add or remove tools'. The interactive picker shows a DECOMMISSION WARNING, but the direct-args path has no confirmation. A reader running 'specforce init cursor' in a Claude project would lose all of .claude/ (settings, user rules). Suggest stating that the whole tool folder is deleted.
        - title: completion --no-descriptions flag not documented
          detail: The help for 'specforce completion bash|zsh|fish|powershell' shows --no-descriptions; cli.md covers 'completion <shell>' but not this flag. The US-2 NFR says '100% of flags shown by CLI help'. The scenario names only six groups and completion is a Cobra built-in, so the criterion was not failed, but the page does not meet a strict reading of the 100% NFR.
        - title: spec resize documents --size as mandatory; the CLI defaults it to medium
          detail: cli.md shows 'spec resize <slug> --size <size>'. The help shows '--size string ... (default "medium")' with no required mark, so running 'specforce spec resize <slug>' without --size quietly resizes to medium. Either the docs or the CLI should make this explicit.
        - title: Explicit invocation syntaxes not independently re-verified
          detail: QA did not re-check the official docs for Claude Code (/spf.spec), Qwen (/spf.spec), Kimi Code (/skill:spf.spec), OpenCode ('Mention @spf-spec') and Codex (/prompts:spf-spec). US-3 Integrity depends on the implementer's cited sources (worker reports were off-limits to QA). The OpenCode @-mention form is the most doubtful and should be checked.
        - title: CLI shows a wrong Target path for short slugs (product bug, not docs)
          detail: '''specforce spec status docs-beta3-refresh'' reports 100% complete but prints ''Target: .specforce/specs/docs-beta3-refresh/'', a path that does not exist (the real folder is 20261121-0035-docs-beta3-refresh). The docs claim that short slugs are accepted is functionally true; the display is cosmetic.'
        - title: CONTRIBUTING files have no language selector
          detail: README and docs pages have selectors; CONTRIBUTING.md/.pt/.es do not, and did not before this change either. US-9.1 is scoped to docs pages, but the US-6 maintainability NFR suggests adding one.
        - title: Skill name spf.<name> violates Cursor/KiloCode/Antigravity naming rules
          detail: Official docs require lowercase+hyphen names matching the folder (spf-spec); installed name is spf.spec, so explicit invocation/discovery may fail in those tools. Docs use 'ask by name' fallback.
        - title: Codex and Kilo skill folders may differ from kit.yaml
          detail: Codex docs list .agents/skills for repo skills (kit installs .codex/skills); Kilo docs list .kilo/skills (kit installs .kilocode/skills).
        - title: Hooks run without a shell
          detail: core/hooks.go splits on spaces and execs in parallel; pipes/&&/redirects silently misbehave. Docs now say so; product could validate or use a shell.
        - title: archive command group lacks IsAgentCommand annotation
          detail: specforce archive instructions run by an agent in a TTY can trigger update check/notices.
        - title: 'Legacy /spf: syntax remains in kit and module texts'
          detail: spf.spec/spf.implement skill hand-off lines, bug-requirements.yaml template, agent-kit.md BR-KIT-14 and engineering.md (globalEnabledAgents, commands/ folders) are stale.
        - title: spec-management.md documents spec list --type/--status flags that do not exist
          detail: CLI only exposes --json; docs follow the CLI.
