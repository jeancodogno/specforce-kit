        - title: Published GitHub pre-releases are not marked as pre-release
          detail: alpha/beta releases have prerelease=false; releases/latest is v1.0.0-beta.3 while npm latest is 0.2.2, so older npm pre-release installs may be downgraded to 0.2.2 by the old updater until 1.0.0 ships.
